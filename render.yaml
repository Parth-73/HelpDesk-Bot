services:
  - type: web
    name: dpm-101-helpdesk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOLER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: COURSE_DOCS_PATH
        value: SD_Assessment/SD_Assessment/course_docs
      - key: ALLOWED_ORIGINS
        sync: false
