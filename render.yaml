# Creates one public Docker web service and its private PostgreSQL database.
# Render's free PostgreSQL expires after 30 days; upgrade/migrate before then.
services:
  - type: web
    name: dpm-101-helpdesk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dpm-101-helpdesk-db
          property: connectionString
      - key: DATABASE_POOLER
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: COURSE_DOCS_PATH
        value: SD_Assessment/SD_Assessment/course_docs
      # The frontend and API use the same HTTPS origin; cross-origin access
      # stays disabled. No assigned hostname needs to be entered manually.
      - key: ALLOWED_ORIGINS
        value: ""

databases:
  - name: dpm-101-helpdesk-db
    databaseName: dpm_helpdesk
    user: helpdesk
    plan: free
    ipAllowList: []
